nt-family:-apple-system, Helvetica, Arial, sans-serif;font-size:13.5px;font-weight:600;fill:#141c24;text-anchor:middle">6 Reread, commit</text><text x="655.0" y="339.0" style="font-family:-apple-system, Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:400;fill:#46525f;text-anchor:middle">commit_credit, then ledger</text><rect x="900" y="300" width="280" height="50" rx="5" style="fill:#f8eed6;stroke:#8a5a00"/><text x="1040.0" y="323.0" style="font-family:-apple-system, Helvetica, Arial, sans-serif;font-size:13.5px;font-weight:600;fill:#141c24;text-anchor:middle">Chargebee write</text><text x="1040.0" y="339.0" style="font-family:-apple-system, Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:400;fill:#46525f;text-anchor:middle">test site</text><path d="M360 338H560" style="fill:none;stroke:#6f7d8c;stroke-width:1.3" marker-end="url(#wf)"/><text x="440" y="332" style="font-family:-apple-system, Helvetica, Arial, sans-serif;font-size:12px;font-weight:600;fill:#46525f;text-anchor:start">act</text><path d="M750 325H900" style="fill:none;stroke:#6f7d8c;stroke-width:1.3" marker-end="url(#wf)"/><text x="760" y="318" style="font-family:-apple-system, Helvetica, Arial, sans-serif;font-size:12px;font-weight:400;fill:#46525f;text-anchor:start">credit</text><rect x="190" y="390" width="170" height="50" rx="5" style="fill:#f4f6f8;stroke:#bfc9d4"/><text x="275.0" y="413.0" style="font-family:-apple-system, Helvetica, Arial, sans-serif;font-size:13.5px;font-weight:600;fill:#141c24;text-anchor:middle">7 Route question</text><text x="275.0" y="429.0" style="font-family:-apple-system, Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:400;fill:#46525f;text-anchor:middle">hold or gather</text><rect x="900" y="390" width="280" height="50" rx="5" style="fill:#f8eed6;stroke:#8a5a00"/><text x="1040.0" y="413.0" style="font-family:-apple-system, Helvetica, Arial, sans-serif;font-size:13.5px;font-weight:600;fill:#141c24;text-anchor:middle">Slack</text><text x="1040.0"