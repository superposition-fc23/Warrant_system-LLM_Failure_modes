<svg viewBox="0 0 1200 556" role="img" aria-label="Warrant v5 data flow. Data leaves the process on these paths: the compare call to Together AI with names as tokens, CRM and billing reads, the credit write, the Slack card with roles and account IDs in place of names, and the two judges, which see only the expected and the named fact. Traces with prompts and replies go to a local Phoenix and stay on the machine." xmlns="http://www.w3.org/2000/svg"><defs><marker id="wf5" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" style="fill:#6f7d8c"/></marker></defs><rect width="1200" height="556" style="fill:#ffffff"/><text x="20" y="16" style="font-family:-apple-system, Helvetica, Arial, sans-serif;font-size:11px;font-weight:600;fill:#6f7d8c;text-anchor:start">INSIDE OUR PROCESS</text><text x="900" y="16" style="font-family:-apple-system, Helvetica, Arial, sans-serif;font-size:11px;font-weight:600;fill:#8a5a00;text-anchor:start">LEAVES OUR PROCESS</text><line x1="870" y1="4" x2="870" y2="552" style="stroke:#8a5a00;stroke-width:1.3;stroke-dasharray:6 4"/><rect x="20" y="30" width="130" height="50" rx="5" style="fill:#f4f6f8;stroke:#bfc9d4;stroke-dasharray:5 4"/><text x="85.0" y="53.0" style="font-family:-apple-system, Helvetica, Arial, sans-serif;font-size:13.5px;font-weight:600;fill:#141c24;text-anchor:middle">Ticket</text><text x="85.0" y="69.0" style="font-family:-apple-system, Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:400;fill:#46525f;text-anchor:middle">scripted</text><rect x="190" y="30" width="170" height="50" rx="5" style="fill:#f4f6f8;stroke:#bfc9d4"/><text x="275.0" y="53.0" style="font-family:-apple-system, Helvetica, Arial, sans-serif;font-size:13.5px;font-weight:600;fill:#141c24;text-anchor:middle">1 Proposal</text><text x="275.0" y="69.0" style="font-family:-apple-system, Helvetica, Arial, sans-serif;font-size:11.5px;font-weight:400;fill:#46525f;text-anchor:middle">agent or e